<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d18" />
    <meta name="description" content="StreamLink XR — Meta Quest competition experience." />
    <title>StreamLink XR — Quest Arena</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #scene-container { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d18; }
      #scene-container { position: fixed; inset: 0; }
      #hud { position: fixed; z-index: 5; top: 18px; left: 18px; color: #f4f7ff; font: 14px/1.45 system-ui, sans-serif; pointer-events: none; }
      #hud strong { display: block; font-size: 19px; letter-spacing: .02em; }
      #hud span { color: #9caac5; }
      #enter-xr { position: fixed; z-index: 6; right: 18px; top: 18px; border: 1px solid #6577a4; border-radius: 999px; padding: 12px 18px; background: #263d72; color: white; font-weight: 700; cursor: pointer; }
      #enter-xr:disabled { opacity: .45; cursor: not-allowed; }
      #status { position: fixed; z-index: 6; bottom: 18px; left: 18px; color: #aebbd4; font: 12px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="hud"><strong>STREAMLINK XR</strong><span>QUEST COMPETITION BUILD · INTERACTIVE STUDIO</span></div>
    <button id="enter-xr" type="button" disabled>Checking XR…</button>
    <div id="status">Loading immersive studio…</div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
