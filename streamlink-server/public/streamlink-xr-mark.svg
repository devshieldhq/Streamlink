<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Tile, matching the in-app card style: dark fill, cool-violet border -->
  <rect x="10" y="10" width="220" height="220" rx="44" fill="#0d1020" stroke="#2a2f55" stroke-width="3"/>

  <!-- Signal fan radiating from a single point — the "one pinch, many
       platforms" idea: a hand-controlled source broadcasting outward,
       violet (AI / control) shading into green (live) across the three
       rings, echoing the app's own status-color language. -->
  <path d="M 60 150 A 40 40 0 0 1 94.64 170" fill="none" stroke="#7c5cff" stroke-width="13" stroke-linecap="round"/>
  <path d="M 60 120 A 70 70 0 0 1 120.62 155" fill="none" stroke="#63c9a6" stroke-width="11" stroke-linecap="round"/>
  <path d="M 60 90  A 100 100 0 0 1 146.6 140" fill="none" stroke="#3ddc84" stroke-width="9"  stroke-linecap="round"/>

  <!-- Source point -->
  <circle cx="60" cy="190" r="10" fill="#e7e9f5"/>
</svg>
