name: StreamLink Quest Studio Integration

on:
  pull_request:
    branches: [main, iwsdk-streamlink-integration]
    paths:
      - "streamlink-server/quest-competition/**"
      - "streamlink-server/Dockerfile"
      - "streamlink-server/server.js"
      - ".github/workflows/quest-studio-integration.yml"
  push:
    branches: [iwsdk-streamlink-integration, iwsdk-backend-port]

jobs:
  build-quest-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlink-server/quest-competition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
